{% extends 'base.html' %}

{% block title %}Редактирование комментария — Jamboo{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-xl shadow-sm p-6">
        <h1 class="text-xl font-bold text-gray-900 mb-4">Редактирование комментария</h1>
        
        <form method="post" class="space-y-4">
            {% csrf_token %}
            <textarea 
                name="content" 
                rows="3"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent resize-y"
                required
            >{{ comment.content }}</textarea>
            
            <div class="flex space-x-3">
                <button type="submit" class="px-6 py-2 bg-orange-500 hover:bg-orange-600 text-white font-medium rounded-lg transition-colors">
                    Сохранить
                </button>
                <a href="{{ comment.post.get_absolute_url }}" class="px-6 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium rounded-lg transition-colors">
                    Отмена
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
