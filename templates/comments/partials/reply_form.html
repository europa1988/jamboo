<!-- Форма ответа на комментарий (вставляется HTMX) -->
<div class="reply-form-wrapper mb-3 mt-2">
    <div class="bg-gray-50 rounded-lg p-3">
        <p class="text-xs text-gray-500 mb-2">
            Ответ u/{{ parent_comment.author.username }}
        </p>
        <form 
            hx-post="{% url 'comments:create' post.id %}"
            hx-target="#replies-{{ parent_comment.id }}"
            hx-swap="beforeend"
            hx-on::after-request="if(event.detail.successful) { document.querySelector('#reply-form-container-{{ parent_comment.id }}').innerHTML = ''; }"
        >
            {% csrf_token %}
            <input type="hidden" name="parent_id" value="{{ parent_comment.id }}">
            
            <textarea 
                name="content" 
                rows="3"
                placeholder="Напишите ответ..."
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent resize-y text-sm mb-2"
                required
            ></textarea>
            
            <div class="flex justify-end space-x-2">
                <button 
                    type="button"
                    onclick="document.getElementById('reply-form-container-{{ parent_comment.id }}').innerHTML = '';"
                    class="px-3 py-1.5 text-sm text-gray-600 hover:bg-gray-200 rounded-lg transition-colors"
                >
                    Отмена
                </button>
                <button 
                    type="submit"
                    class="px-4 py-1.5 bg-orange-500 hover:bg-orange-600 text-white text-sm font-medium rounded-lg transition-colors"
                >
                    Ответить
                </button>
            </div>
        </form>
    </div>
</div>
