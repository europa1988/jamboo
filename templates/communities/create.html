{% extends 'base.html' %}

{% block title %}Создать сообщество — Jamboo{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-xl shadow-sm p-8">
        <h1 class="text-2xl font-bold text-gray-900 mb-6">Создать сообщество</h1>
        
        <form method="post" enctype="multipart/form-data" class="space-y-6">
            {% csrf_token %}
            
            <!-- Название -->
            <div>
                <label for="id_name" class="block text-sm font-medium text-gray-700 mb-2">Название *</label>
                <input type="text" name="name" id="id_name" maxlength="50" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent"
                    placeholder="Например: IT">
                <p class="mt-1 text-xs text-gray-500">Максимум 50 символов. URL будет сгенерирован автоматически.</p>
            </div>
            
            <!-- Описание -->
            <div>
                <label for="id_description" class="block text-sm font-medium text-gray-700 mb-2">Описание</label>
                <textarea name="description" id="id_description" rows="4" maxlength="1000"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent resize-y"
                    placeholder="О чём это сообщество?"></textarea>
            </div>
            
            <!-- Тип -->
            <div>
                <label for="id_community_type" class="block text-sm font-medium text-gray-700 mb-2">Тип сообщества</label>
                <select name="community_type" id="id_community_type"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent bg-white">
                    <option value="public">Открытое — любой может видеть и участвовать</option>
                    <option value="restricted">Ограниченное — любой может видеть, только участники могут постить</option>
                    <option value="private">Закрытое — только участники могут видеть и постить</option>
                </select>
            </div>
            
            <!-- Аватар -->
            <div>
                <label for="id_avatar" class="block text-sm font-medium text-gray-700 mb-2">Аватар</label>
                <input type="file" name="avatar" id="id_avatar" accept="image/*"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-orange-50 file:text-orange-700">
            </div>
            
            <!-- Баннер -->
            <div>
                <label for="id_banner" class="block text-sm font-medium text-gray-700 mb-2">Баннер</label>
                <input type="file" name="banner" id="id_banner" accept="image/*"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-orange-50 file:text-orange-700">
            </div>
            
            <!-- Кнопки -->
            <div class="flex space-x-4 pt-4">
                <button type="submit" class="px-6 py-2.5 bg-orange-500 hover:bg-orange-600 text-white font-medium rounded-lg transition-colors">
                    Создать сообщество
                </button>
                <a href="{% url 'communities:list' %}" class="px-6 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium rounded-lg transition-colors">
                    Отмена
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
