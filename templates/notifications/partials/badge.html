<!-- Бейдж уведомлений -->
<div id="notification-badge" class="relative inline-block">
    <a href="{% url 'notifications:list' %}" class="p-2 hover:bg-gray-100 rounded-full inline-flex items-center justify-center transition-colors relative">
        🔔
        {% if unread_count > 0 %}
        <span class="absolute -top-0.5 -right-0.5 bg-red-500 text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center">
            {{ unread_count }}
        </span>
        {% endif %}
    </a>
</div>
