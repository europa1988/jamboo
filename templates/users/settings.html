{% extends 'base.html' %}

{% block title %}Настройки — Jamboo{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-xl shadow-sm p-8">
        <h1 class="text-2xl font-bold text-gray-900 mb-6">Настройки профиля</h1>
        
        <form method="post" enctype="multipart/form-data" class="space-y-6">
            {% csrf_token %}
            
            <!-- Аватар -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Аватар</label>
                <div class="flex items-center space-x-4">
                    <div class="w-16 h-16 rounded-full bg-orange-200 flex items-center justify-center text-orange-700 text-xl font-bold overflow-hidden">
                        {% if user.profile.avatar %}
                        <img src="{{ user.profile.avatar.url }}" class="w-full h-full object-cover">
                        {% else %}
                        {{ user.username|first|upper }}
                        {% endif %}
                    </div>
                    <div class="flex-1">
                        <input type="file" name="avatar" accept="image/*"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-orange-50 file:text-orange-700">
                    </div>
                </div>
            </div>
            
            <!-- О себе -->
            <div>
                <label for="id_bio" class="block text-sm font-medium text-gray-700 mb-2">О себе</label>
                <textarea name="bio" id="id_bio" rows="4" maxlength="500"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent resize-y"
                    placeholder="Расскажите о себе...">{{ form.bio.value|default:'' }}</textarea>
                <p class="mt-1 text-xs text-gray-500">Максимум 500 символов</p>
            </div>
            
            <!-- Настройки приватности -->
            <div class="space-y-3">
                <h3 class="text-sm font-medium text-gray-900">Приватность</h3>
                
                <label class="flex items-center space-x-3 cursor-pointer">
                    <input type="checkbox" name="show_email" {% if form.show_email.value %}checked{% endif %}
                        class="w-4 h-4 text-orange-500 rounded focus:ring-orange-500 border-gray-300">
                    <span class="text-sm text-gray-700">Показывать email в профиле</span>
                </label>
                
                <label class="flex items-center space-x-3 cursor-pointer">
                    <input type="checkbox" name="nsfw_enabled" {% if form.nsfw_enabled.value %}checked{% endif %}
                        class="w-4 h-4 text-orange-500 rounded focus:ring-orange-500 border-gray-300">
                    <span class="text-sm text-gray-700">Показывать NSFW-контент</span>
                </label>
            </div>
            
            <!-- Кнопки -->
            <div class="flex space-x-4 pt-4 border-t border-gray-100">
                <button type="submit" class="px-6 py-2.5 bg-orange-500 hover:bg-orange-600 text-white font-medium rounded-lg transition-colors">
                    Сохранить изменения
                </button>
                <a href="{% url 'users:profile' user.username %}" class="px-6 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium rounded-lg transition-colors">
                    Отмена
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
