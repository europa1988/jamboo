<div class="vote-widget flex items-center space-x-1" id="comment-vote-{{ comment.id }}">
    <button 
        hx-post="{% url 'votes:comment' comment.id %}"
        hx-vals='{"action": "up"}'
        hx-target="#comment-vote-{{ comment.id }}"
        hx-swap="outerHTML"
        class="text-xs transition-colors p-1 rounded hover:bg-gray-200
        {% if user_vote == 1 %}text-orange-500{% else %}text-gray-400{% endif %}"
        title="Апвоут"
    >
        ▲
    </button>
    
    <span class="text-xs font-bold
        {% if user_vote == 1 %}text-orange-500
        {% elif user_vote == -1 %}text-blue-500
        {% else %}text-gray-700{% endif %}">
        {{ comment.score }}
    </span>
    
    <button 
        hx-post="{% url 'votes:comment' comment.id %}"
        hx-vals='{"action": "down"}'
        hx-target="#comment-vote-{{ comment.id }}"
        hx-swap="outerHTML"
        class="text-xs transition-colors p-1 rounded hover:bg-gray-200
        {% if user_vote == -1 %}text-blue-500{% else %}text-gray-400{% endif %}"
        title="Даунвоут"
    >
        ▼
    </button>
</div>
